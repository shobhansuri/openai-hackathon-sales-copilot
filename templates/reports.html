<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Reports - Sales Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .modal-backdrop { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(4px); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 via-yellow-50/30 to-gray-50 text-gray-900 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 py-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-gradient-to-br from-yellow-500 to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-yellow-500/25">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">Call Reports</h1>
                    <p class="text-gray-500 text-sm">Post-call coaching analysis and history</p>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="/dashboard" class="px-4 py-2 bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-300 text-gray-600 hover:text-blue-700 rounded-xl text-sm font-medium transition-all">
                    Agents
                </a>
                <a href="/products" class="px-4 py-2 bg-gray-50 hover:bg-green-50 border border-gray-200 hover:border-green-300 text-gray-600 hover:text-green-700 rounded-xl text-sm font-medium transition-all">
                    Products
                </a>
                <a href="/tools" class="px-4 py-2 bg-gray-50 hover:bg-purple-50 border border-gray-200 hover:border-purple-300 text-gray-600 hover:text-purple-700 rounded-xl text-sm font-medium transition-all">
                    Tools
                </a>
                <a href="/" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium shadow-lg shadow-indigo-500/25 transition-all">
                    Back to App
                </a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-6xl mx-auto p-6">

        <!-- Reports List -->
        <div id="reportsList" class="space-y-4">
            <!-- Report cards will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-16 h-16 bg-yellow-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <p class="text-gray-500 text-lg mb-2">No call reports yet</p>
            <p class="text-gray-400 text-sm mb-6">Reports are generated automatically when you end a call</p>
            <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold shadow-lg shadow-indigo-500/25 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Start a Call
            </a>
        </div>
    </main>

    <!-- Report Detail Modal -->
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col slide-in">
            <div class="px-6 py-5 border-b border-gray-200 flex items-center justify-between bg-gradient-to-r from-yellow-50 to-white">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-yellow-500 to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-yellow-500/25">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <h2 id="modalTitle" class="text-lg font-bold text-gray-900">Call Report</h2>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div id="modalContent" class="flex-1 overflow-y-auto p-6 space-y-5">
                <!-- Report details will be inserted here -->
            </div>

            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3 bg-gray-50">
                <button onclick="deleteCurrentReport()"
                    class="px-5 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 hover:text-red-700 rounded-xl text-sm font-medium transition-all">
                    Delete Report
                </button>
                <button onclick="closeModal()"
                    class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium shadow-lg shadow-indigo-500/25 transition-all">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
    // ============ STATE ============
    let reports = [];
    let currentReportId = null;

    // ============ LOAD REPORTS ============
    async function loadReports() {
        try {
            const res = await fetch('/api/reports');
            reports = await res.json();
            renderReports();
        } catch (err) {
            console.error('Failed to load reports:', err);
        }
    }

    function renderReports() {
        const list = document.getElementById('reportsList');
        const emptyState = document.getElementById('emptyState');

        if (reports.length === 0) {
            list.classList.add('hidden');
            emptyState.classList.remove('hidden');
            return;
        }

        list.classList.remove('hidden');
        emptyState.classList.add('hidden');

        list.innerHTML = reports.map(report => {
            const date = new Date(report.created_at).toLocaleDateString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            const duration = formatDuration(report.duration_seconds);

            let highlights = [];
            let tips = [];
            try {
                highlights = JSON.parse(report.highlights || '[]');
                tips = JSON.parse(report.coaching_tips || '[]');
            } catch (e) {}

            return `
            <div class="bg-white rounded-2xl p-5 border border-gray-200 hover:border-yellow-300 hover:shadow-lg transition-all duration-200 cursor-pointer group"
                 onclick="openReportModal(${report.id})">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 bg-gradient-to-br from-yellow-100 to-orange-100 rounded-xl flex items-center justify-center group-hover:from-yellow-200 group-hover:to-orange-200 transition-colors">
                            <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-900">${escapeHtml(report.agent_name || 'Unknown Agent')}</h3>
                            <p class="text-gray-500 text-sm">${date} • ${duration}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <span class="px-3 py-1 bg-green-50 text-green-700 border border-green-200 rounded-lg text-xs font-medium">${highlights.length} highlights</span>
                        <span class="px-3 py-1 bg-yellow-50 text-yellow-700 border border-yellow-200 rounded-lg text-xs font-medium">${tips.length} tips</span>
                    </div>
                </div>
                <p class="text-gray-600 text-sm line-clamp-2">${escapeHtml(report.summary || 'No summary available')}</p>
            </div>
        `}).join('');
    }

    // ============ MODAL ============
    async function openReportModal(id) {
        currentReportId = id;
        const report = reports.find(r => r.id === id);
        if (!report) return;

        const date = new Date(report.created_at).toLocaleDateString('en-US', {
            weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        const duration = formatDuration(report.duration_seconds);

        let highlights = [];
        let tips = [];
        let conversation = [];
        try {
            highlights = JSON.parse(report.highlights || '[]');
            tips = JSON.parse(report.coaching_tips || '[]');
            conversation = JSON.parse(report.conversation || '[]');
        } catch (e) {}

        document.getElementById('modalTitle').textContent = `${report.agent_name || 'Unknown'} Report`;
        document.getElementById('modalContent').innerHTML = `
            <div class="text-sm text-gray-500 mb-4 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                ${date} • Duration: ${duration}
            </div>

            <!-- Summary -->
            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Summary</h3>
                <p class="text-gray-700 leading-relaxed">${escapeHtml(report.summary || 'No summary available')}</p>
            </div>

            <!-- Highlights -->
            <div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-xl p-5 border border-green-200">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-7 h-7 bg-green-100 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h3 class="text-sm font-semibold text-green-700">What Went Well</h3>
                </div>
                ${highlights.length > 0 ? `
                    <ul class="space-y-2">
                        ${highlights.map(h => `<li class="flex gap-3 text-gray-700 text-sm"><span class="text-green-500 font-bold">✓</span>${escapeHtml(h)}</li>`).join('')}
                    </ul>
                ` : '<p class="text-gray-500 text-sm italic">No highlights recorded</p>'}
            </div>

            <!-- Coaching Tips -->
            <div class="bg-gradient-to-br from-amber-50 to-yellow-50 rounded-xl p-5 border border-yellow-200">
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-7 h-7 bg-yellow-100 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <h3 class="text-sm font-semibold text-yellow-700">Areas to Improve</h3>
                </div>
                ${tips.length > 0 ? `
                    <ul class="space-y-2">
                        ${tips.map(t => `<li class="flex gap-3 text-gray-700 text-sm"><span class="text-yellow-600 font-bold">→</span>${escapeHtml(t)}</li>`).join('')}
                    </ul>
                ` : '<p class="text-gray-500 text-sm italic">No coaching tips</p>'}
            </div>

            <!-- Conversation Log -->
            <details class="bg-gray-50 rounded-xl p-5 border border-gray-200">
                <summary class="text-sm font-medium text-gray-700 cursor-pointer hover:text-indigo-600 transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    View Conversation (${conversation.length} turns)
                </summary>
                <div class="mt-4 space-y-2 max-h-64 overflow-y-auto">
                    ${conversation.map(turn => {
                        const roleConfig = turn.role === 'user'
                            ? { bg: 'bg-blue-50', border: 'border-blue-200', label: 'text-blue-600', name: 'Speech' }
                            : turn.role === 'ai'
                            ? { bg: 'bg-green-50', border: 'border-green-200', label: 'text-green-600', name: 'AI Coach' }
                            : { bg: 'bg-purple-50', border: 'border-purple-200', label: 'text-purple-600', name: 'Tool' };
                        return `
                            <div class="p-3 rounded-xl border ${roleConfig.bg} ${roleConfig.border}">
                                <span class="text-xs font-semibold ${roleConfig.label}">${roleConfig.name}:</span>
                                <p class="text-sm text-gray-700 mt-1">${escapeHtml(turn.text || '')}</p>
                            </div>
                        `;
                    }).join('')}
                </div>
            </details>
        `;

        document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal').classList.add('hidden');
        currentReportId = null;
    }

    async function deleteCurrentReport() {
        if (!currentReportId) return;
        if (!confirm('Are you sure you want to delete this report?')) return;

        try {
            const res = await fetch(`/api/reports/${currentReportId}`, { method: 'DELETE' });
            if (res.ok) {
                closeModal();
                loadReports();
            } else {
                alert('Failed to delete report');
            }
        } catch (err) {
            console.error('Delete error:', err);
            alert('Failed to delete report');
        }
    }

    // ============ UTILS ============
    function formatDuration(seconds) {
        if (!seconds) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Close modal on Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // Close modal on backdrop click
    document.getElementById('modal').addEventListener('click', (e) => {
        if (e.target.id === 'modal') closeModal();
    });

    // Init
    loadReports();
    </script>
</body>
</html>
