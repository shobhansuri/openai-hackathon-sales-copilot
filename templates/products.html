<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Sales Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .modal-backdrop { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(4px); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 via-green-50/30 to-gray-50 text-gray-900 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 py-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-green-600 rounded-xl flex items-center justify-center shadow-lg shadow-green-500/25">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">Product Catalog</h1>
                    <p class="text-gray-500 text-sm">Manage products for AI recommendations</p>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="/dashboard" class="px-4 py-2 bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-300 text-gray-600 hover:text-blue-700 rounded-xl text-sm font-medium transition-all">
                    Agents
                </a>
                <a href="/tools" class="px-4 py-2 bg-gray-50 hover:bg-purple-50 border border-gray-200 hover:border-purple-300 text-gray-600 hover:text-purple-700 rounded-xl text-sm font-medium transition-all">
                    Tools
                </a>
                <a href="/reports" class="px-4 py-2 bg-gray-50 hover:bg-yellow-50 border border-gray-200 hover:border-yellow-300 text-gray-600 hover:text-yellow-700 rounded-xl text-sm font-medium transition-all">
                    Reports
                </a>
                <a href="/" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium shadow-lg shadow-indigo-500/25 transition-all">
                    Back to App
                </a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-6xl mx-auto p-6">

        <!-- Create Button -->
        <div class="mb-6">
            <button onclick="openCreateModal()"
                class="px-6 py-3 bg-green-600 hover:bg-green-500 text-white rounded-xl font-semibold shadow-lg shadow-green-500/25 transition-all flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                Add Product
            </button>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Product cards will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
            </div>
            <p class="text-gray-500 text-lg mb-2">No products added yet</p>
            <p class="text-gray-400 text-sm mb-6">Add products for AI to recommend during calls</p>
            <button onclick="openCreateModal()"
                class="px-6 py-3 bg-green-600 hover:bg-green-500 text-white rounded-xl font-semibold shadow-lg shadow-green-500/25 transition-all">
                Add Your First Product
            </button>
        </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden slide-in">
            <div class="px-6 py-5 border-b border-gray-200 flex items-center justify-between bg-gradient-to-r from-green-50 to-white">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-green-600 rounded-xl flex items-center justify-center shadow-lg shadow-green-500/25">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                        </svg>
                    </div>
                    <h2 id="modalTitle" class="text-lg font-bold text-gray-900">Add Product</h2>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="productForm" onsubmit="handleSubmit(event)" class="p-6 space-y-5">
                <input type="hidden" id="productId" value="">

                <!-- Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Product Name *</label>
                    <input type="text" id="productName" required
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-green-500/30 focus:border-green-400 transition-all"
                        placeholder="e.g., Pro Plan, Enterprise License">
                </div>

                <!-- Price -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Price</label>
                    <input type="number" id="productPrice" step="0.01" min="0"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-green-500/30 focus:border-green-400 transition-all"
                        placeholder="e.g., 99.00 (leave empty for 'Contact for pricing')">
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                    <textarea id="productDescription" rows="3"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-green-500/30 focus:border-green-400 transition-all"
                        placeholder="Key features and benefits..."></textarea>
                </div>

                <!-- URL -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Product URL</label>
                    <input type="url" id="productUrl"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-green-500/30 focus:border-green-400 transition-all"
                        placeholder="https://example.com/product">
                </div>

                <!-- Image URL -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Image URL</label>
                    <input type="url" id="productImageUrl"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-green-500/30 focus:border-green-400 transition-all"
                        placeholder="https://example.com/image.jpg">
                </div>

                <!-- Submit -->
                <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
                    <button type="button" onclick="closeModal()"
                        class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-medium transition-all">
                        Cancel
                    </button>
                    <button type="submit" id="submitBtn"
                        class="px-6 py-2.5 bg-green-600 hover:bg-green-500 text-white rounded-xl font-semibold shadow-lg shadow-green-500/25 transition-all">
                        Add Product
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
    // ============ STATE ============
    let products = [];
    let editingProductId = null;

    // ============ LOAD PRODUCTS ============
    async function loadProducts() {
        try {
            const res = await fetch('/api/products');
            products = await res.json();
            renderProducts();
        } catch (err) {
            console.error('Failed to load products:', err);
        }
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        const emptyState = document.getElementById('emptyState');

        if (products.length === 0) {
            grid.classList.add('hidden');
            emptyState.classList.remove('hidden');
            return;
        }

        grid.classList.remove('hidden');
        emptyState.classList.add('hidden');

        grid.innerHTML = products.map(product => `
            <div class="bg-white rounded-2xl overflow-hidden border border-gray-200 hover:border-green-300 hover:shadow-lg transition-all duration-200 group">
                ${product.image_url ? `
                    <div class="h-40 bg-gray-100 overflow-hidden">
                        <img src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name)}"
                            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                            onerror="this.parentElement.innerHTML='<div class=\\'flex items-center justify-center h-full text-gray-400 bg-gradient-to-br from-gray-100 to-gray-50\\'><svg class=\\'w-10 h-10\\' fill=\\'none\\' stroke=\\'currentColor\\' viewBox=\\'0 0 24 24\\'><path stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' stroke-width=\\'1.5\\' d=\\'M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z\\'></path></svg></div>'">
                    </div>
                ` : `
                    <div class="h-32 bg-gradient-to-br from-green-50 to-emerald-50 flex items-center justify-center">
                        <svg class="w-12 h-12 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                        </svg>
                    </div>
                `}
                <div class="p-5">
                    <div class="mb-3">
                        <h3 class="font-semibold text-gray-900 text-lg">${escapeHtml(product.name)}</h3>
                        <p class="text-green-600 font-bold text-lg">
                            ${product.price ? '$' + product.price.toFixed(2) : '<span class="text-gray-400 font-normal text-sm">Contact for pricing</span>'}
                        </p>
                    </div>

                    <p class="text-gray-500 text-sm mb-4 line-clamp-2">
                        ${escapeHtml(product.description || 'No description')}
                    </p>

                    ${product.url ? `
                        <a href="${escapeHtml(product.url)}" target="_blank"
                            class="text-indigo-600 hover:text-indigo-700 text-sm block mb-4 truncate font-medium">
                            ${escapeHtml(product.url)}
                        </a>
                    ` : ''}

                    <div class="flex gap-2">
                        <button onclick="openEditModal(${product.id})"
                            class="flex-1 px-4 py-2.5 bg-gray-100 hover:bg-green-100 text-gray-700 hover:text-green-700 rounded-xl text-sm font-medium transition-all">
                            Edit
                        </button>
                        <button onclick="disableProduct(${product.id})"
                            class="px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 hover:text-red-700 rounded-xl text-sm font-medium transition-all">
                            Remove
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // ============ MODAL ============
    function openCreateModal() {
        editingProductId = null;
        document.getElementById('modalTitle').textContent = 'Add Product';
        document.getElementById('submitBtn').textContent = 'Add Product';
        document.getElementById('productForm').reset();
        document.getElementById('productId').value = '';
        document.getElementById('modal').classList.remove('hidden');
    }

    function openEditModal(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;

        editingProductId = id;
        document.getElementById('modalTitle').textContent = 'Edit Product';
        document.getElementById('submitBtn').textContent = 'Save Changes';
        document.getElementById('productId').value = id;
        document.getElementById('productName').value = product.name;
        document.getElementById('productPrice').value = product.price || '';
        document.getElementById('productDescription').value = product.description || '';
        document.getElementById('productUrl').value = product.url || '';
        document.getElementById('productImageUrl').value = product.image_url || '';
        document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal').classList.add('hidden');
        editingProductId = null;
    }

    // ============ FORM SUBMIT ============
    async function handleSubmit(event) {
        event.preventDefault();

        const priceValue = document.getElementById('productPrice').value;
        const data = {
            name: document.getElementById('productName').value,
            price: priceValue ? parseFloat(priceValue) : null,
            description: document.getElementById('productDescription').value || null,
            url: document.getElementById('productUrl').value || null,
            image_url: document.getElementById('productImageUrl').value || null
        };

        try {
            let res;
            if (editingProductId) {
                res = await fetch(`/api/products/${editingProductId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } else {
                res = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }

            if (res.ok) {
                closeModal();
                loadProducts();
            } else {
                const err = await res.json();
                alert('Error: ' + (err.detail || 'Failed to save product'));
            }
        } catch (err) {
            console.error('Submit error:', err);
            alert('Failed to save product');
        }
    }

    // ============ DISABLE ============
    async function disableProduct(id) {
        if (!confirm('Are you sure you want to remove this product?')) return;

        try {
            const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadProducts();
            } else {
                alert('Failed to remove product');
            }
        } catch (err) {
            console.error('Disable error:', err);
            alert('Failed to remove product');
        }
    }

    // ============ UTILS ============
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Close modal on Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // Close modal on backdrop click
    document.getElementById('modal').addEventListener('click', (e) => {
        if (e.target.id === 'modal') closeModal();
    });

    // Init
    loadProducts();
    </script>
</body>
</html>
